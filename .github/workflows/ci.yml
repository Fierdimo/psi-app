name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Formato, tipos, guardia de color y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      # Hace cumplir SPEC.md §2.1 (nunca negro) y la regla de un solo origen
      # de color. Sin esto, el principio se erosiona en semanas.
      - name: Guardia de color
        run: pnpm check:colors

      - name: Build
        run: pnpm build

  migraciones:
    name: Migraciones, RLS y flujos end-to-end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Levanta Postgres y aplica TODAS las migraciones desde cero. Detecta
      # migraciones que solo funcionan sobre una base que ya tiene estado.
      - name: Aplicar migraciones sobre base limpia
        run: supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor

      # La prueba más importante del proyecto: que un paciente no pueda leer
      # datos de otro, ni escalar su propio rol, ni confirmar citas.
      - name: Pruebas de RLS
        run: supabase test db

      - name: Publicar credenciales locales al entorno
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      - name: Instalar navegador
        run: pnpm exec playwright install --with-deps chromium

      - name: Flujos de autenticación y roles
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
