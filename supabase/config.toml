# Configuración mínima de Supabase local.
#
# ATENCIÓN: este archivo se escribió a mano porque el CLI de Supabase no
# estaba instalado al crear el proyecto. Cuando lo instales, ejecuta
# `supabase init` en una carpeta aparte y compara: el CLI genera el archivo
# completo de la versión que tengas, con claves que aquí pueden faltar.
#
# Las migraciones de supabase/migrations/ son lo portable y lo importante;
# este archivo solo describe el entorno local.

project_id = "psi-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
# Servidor de correo de prueba. Los correos de verificación y recuperación
# caen aquí en local; nunca salen a internet.
#
# `smtp_port` se abre para que TAMBIÉN los transaccionales —cita confirmada,
# invitación, recordatorio— se puedan ver aquí en desarrollo. Antes solo se
# escribían en la consola del servidor, así que era imposible mirar cómo
# quedaba un correo sin desplegarlo.
enabled = true
port = 54324
smtp_port = 54325

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
# Verificación obligatoria: SPEC.md §4.1. Un correo sin verificar no debe
# poder acceder a información clínica.
enable_confirmations = true
double_confirm_changes = true

# -----------------------------------------------------------------------------
# Las plantillas, en español y con la marca.
#
# Sin esto llega el texto por defecto de Supabase: «Confirm your email address»,
# en inglés y desde una dirección de ejemplo. Es el PRIMER correo que recibe
# alguien que se registra, así que decidía la primera impresión de la
# plataforma sin que nadie lo hubiera escrito.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# El remitente.
#
# Sin esto, GoTrue firma como «Admin <admin@email.com>»: una dirección de
# ejemplo que llegaba al buzón de quien se registra.
#
# EN PRODUCCIÓN hay que activar `enabled` y rellenar host, usuario y clave con
# los de un proveedor de envío. Mientras esté en `false`, los correos se quedan
# en Mailpit —que es lo que se quiere en local— pero el nombre y la dirección
# del remitente ya son los de verdad, así que se ve lo mismo que verá el
# destinatario final. Ver `docs/DESPLIEGUE.md`.
# -----------------------------------------------------------------------------
[auth.email.smtp]
enabled = false
host = "env(SMTP_HOST)"
port = 587
user = "env(SMTP_USER)"
pass = "env(SMTP_PASS)"
admin_email = "jbanquez@jbrpsicometrias.com"
sender_name = "JBR Psicometrías"

[auth.email.template.confirmation]
subject = "Confirma tu correo · JBR Psicometrías"
content_path = "./supabase/templates/confirmacion.html"

[auth.email.template.recovery]
subject = "Restablece tu contraseña · JBR Psicometrías"
content_path = "./supabase/templates/recuperacion.html"

[auth.email.template.email_change]
subject = "Confirma tu correo nuevo · JBR Psicometrías"
content_path = "./supabase/templates/cambio-de-correo.html"

[auth.email.template.invite]
subject = "Te invitaron a JBR Psicometrías"
content_path = "./supabase/templates/invitacion.html"
